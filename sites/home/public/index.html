<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wanngo — little apps from a little room</title>
  <meta name="description" content="Hi, I’m wanngo (Quan Ngo), an indie dev making apps, websites and open-source things. Code, sleep, code again." />
  <link rel="canonical" href="https://wanngo.com/" />
  <meta property="og:title" content="wanngo — little apps from a little room" />
  <meta property="og:description" content="An indie dev making apps, websites and open-source things. Code, sleep, code again." />
  <meta property="og:url" content="https://wanngo.com/" />
  <meta property="og:image" content="https://wanngo.com/assets/og-room.png" />
  <meta name="theme-color" content="#EFE6D6" />
  <script>
    (function () {
      var t = null;
      try {
        var p = new URLSearchParams(window.location.search).get('theme');
        if (p === 'dark' || p === 'light') t = p;
        else t = localStorage.getItem('theme');
      } catch (e) {}
      if (t !== 'dark' && t !== 'light') {
        t = 'light';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..700,0..100,0..1&family=Nunito:wght@500;600;700;800&family=Gochi+Hand&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="page">
    <div class="stage" id="stage" data-activity="0">

      <!-- Top Header Navigation -->
      <header class="ui hdr">
        <a class="brand" href="#" aria-label="wanngo, home">
          <svg aria-hidden="true" width="34" height="36" viewBox="0 0 44 46">
            <g stroke="#2E2A26" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 36 C12 29 32 29 32 36 V40 C32 45 12 45 12 40 Z" fill="#CFE3C4"/>
              <circle cx="22" cy="20" r="13" fill="#FFFDF8"/>
              <path d="M8.6 19 C8.6 5 35.4 5 35.4 19 C28.5 16.2 15.5 16.2 8.6 19 Z" fill="#2E2A26"/>
              <circle cx="18" cy="23" r="1.2" fill="#2E2A26"/>
              <circle cx="26" cy="23" r="1.2" fill="#2E2A26"/>
            </g>
            <ellipse cx="14.5" cy="27" rx="2.6" ry="1.5" fill="#F4A9B8"/>
            <ellipse cx="29.5" cy="27" rx="2.6" ry="1.5" fill="#F4A9B8"/>
          </svg>
          <span class="brand-name">wanngo</span>
        </a>
        <nav class="nav" aria-label="Links">
          <a href="https://wanngo.substack.com/" target="_blank" rel="noopener">blog ↗</a>
          <a href="https://github.com/quango2304" target="_blank" rel="noopener">github ↗</a>
          <a href="mailto:admin@bookmuse.wanngo.com">say hi</a>
          <button class="toggle" id="theme" type="button" aria-label="Switch to dark theme" title="Toggle Day / Night">
            <svg class="icon-sun" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="4.5" fill="#FFE08A"/>
              <path d="M12 2.5 V4.5 M12 19.5 V21.5 M2.5 12 H4.5 M19.5 12 H21.5 M5.3 5.3 L6.7 6.7 M17.3 17.3 L18.7 18.7 M5.3 18.7 L6.7 17.3 M17.3 6.7 L18.7 5.3"/>
            </svg>
            <svg class="icon-moon" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 14.5 A8 8 0 1 1 9.5 4 A6.5 6.5 0 0 0 20 14.5 Z" fill="#CFE0F5"/>
            </svg>
          </button>
        </nav>
      </header>

      <!-- 3D / 2.5D Cartoon Room Stage Box -->
      <div class="scene-box" id="scene-box">
        <div class="floor" aria-hidden="true"></div>
        <div id="webgl-mount" class="scene" role="img" aria-label="A live 3D cartoon bedroom. wanngo codes at the desk, walks to bed, sleeps, then gets up and codes again. A ginger cat wanders and plays freely around the room; click it for a heart."></div>
        <div id="floating-fx" class="floating-fx" aria-hidden="true"></div>
      </div>

      <!-- Developer Speech Bubble -->
      <span class="ui say" id="say" aria-hidden="true">hm… one more bug</span>

      <!-- Top-Left Hero Intro & Autonomous Activity Pill -->
      <section class="ui intro">
        <h1 class="h1">I build little apps in a <span class="wavy">little room.</span></h1>
        <p class="lede">Hi, I’m wanngo — an indie dev making apps, websites and open‑source things. Code, sleep, code again.</p>
        <div class="status" aria-hidden="true">
          <span class="s s0"><i style="background:#E58F6B"></i>now: coding</span>
          <span class="s s1"><i style="background:#C9A0E0"></i>now: heading to bed…</span>
          <span class="s s2"><i style="background:#8FA5E8"></i>now: asleep — shh</span>
          <span class="s s3"><i style="background:#6FB36A"></i>now: back to the desk</span>
        </div>
      </section>

      <!-- The Shelf Header -->
      <div class="ui shelfhead">
        <h2 class="h2">the shelf</h2>
        <span class="hand" aria-hidden="true">pick one ↓</span>
      </div>

      <!-- Interactive Shelf Items (2 Rows of 3 on the Bookshelf) -->
      <div class="ui row row1" role="group" aria-label="Projects, top shelf">
        <button class="item" type="button" data-i="0" aria-pressed="false" aria-controls="card">
          <span class="box" aria-hidden="true" style="background:#FFE08A;border-radius:21px 19px 23px 18px">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2E2A26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5 C9.5 5 6 4.6 3 5.1 V18.8 C6 18.3 9.5 18.8 12 20.2 C14.5 18.8 18 18.3 21 18.8 V5.1 C18 4.6 14.5 5 12 6.5 Z M12 6.5 V20.2"/></svg>
          </span>
          <span class="lbl">Bookmuse</span>
        </button>
        <button class="item" type="button" data-i="1" aria-pressed="false" aria-controls="card">
          <span class="box" aria-hidden="true" style="background:#E2D6F3;border-radius:19px 23px 18px 21px">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2E2A26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4 H15 L19 8 V20 H5 Z M15 4 V8 H19 M8 12 H16 M8 15.5 H16 M8 9 H11"/></svg>
          </span>
          <span class="lbl">The blog</span>
        </button>
        <button class="item" type="button" data-i="2" aria-pressed="false" aria-controls="card">
          <span class="box" aria-hidden="true" style="background:#CFE3C4;border-radius:23px 18px 21px 20px">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2E2A26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7 L3 12 L8 17 M16 7 L21 12 L16 17 M13.5 5 L10.5 19"/></svg>
          </span>
          <span class="lbl">Open source</span>
        </button>
      </div>

      <div class="ui row row2" role="group" aria-label="Projects, second shelf">
        <button class="item" type="button" data-i="3" aria-pressed="false" aria-controls="card">
          <span class="box" aria-hidden="true" style="background:#CFE0F5;border-radius:21px 19px 23px 18px">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2E2A26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 H15 M10 3 V9 L4.5 18.5 C3.8 19.8 4.7 21 6 21 H18 C19.3 21 20.2 19.8 19.5 18.5 L14 9 V3 M7 15.5 H17"/></svg>
          </span>
          <span class="lbl">Next app</span>
        </button>
        <button class="item" type="button" data-i="4" aria-pressed="false" aria-controls="card">
          <span class="box" aria-hidden="true" style="background:#FFD3B8;border-radius:19px 23px 18px 21px">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2E2A26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 C4 6 8 5 12 7.5 C16 5 20 6 20 9 C20 14 12 19 12 19 C12 19 4 14 4 9 Z"/></svg>
          </span>
          <span class="lbl">This room</span>
        </button>
        <button class="item" type="button" data-i="5" aria-pressed="false" aria-controls="card">
          <span class="box" aria-hidden="true" style="background:#F7CFD8;border-radius:23px 18px 21px 20px">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2E2A26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5 H20.5 V17.5 H3.5 Z M3.5 7 L12 13 L20.5 7"/></svg>
          </span>
          <span class="lbl">Say hi</span>
        </button>
      </div>

      <!-- Mobile fallback shelf list -->
      <div class="mlist" role="group" aria-label="Projects"></div>

      <!-- Taped Product Navigation Card -->
      <article class="ui card" id="card" aria-live="polite" hidden>
        <span class="tape" aria-hidden="true"></span>
        <button class="close" type="button" aria-label="Close details">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
        </button>
        <div class="chead">
          <span class="cicon" aria-hidden="true"></span>
          <div class="ctitle">
            <span class="kind"></span>
            <h3 class="h3"></h3>
          </div>
        </div>
        <p class="desc"></p>
        <div class="cfoot">
          <span class="dest"></span>
          <a class="open" href="#" target="_blank" rel="noopener"></a>
        </div>
      </article>

    </div>

    <!-- Subtle Paper Grain Texture Overlay -->
    <svg class="grain" aria-hidden="true">
      <filter id="grainF">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#grainF)"/>
    </svg>
  </div>

  <script src="game.js"></script>
  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;
    if (typeof window.initWanngoRoom === 'function') {
      window.initWanngoRoom();
    }
  </script>
</body>
</html>
