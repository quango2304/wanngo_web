  L('m9', {
    id: 'oltp-olap', order: 8, mins: 10, level: 'Beginner',
    title: 'Dòng hay cột? Báo cáo cần một cách lưu khác',
    sub: 'Một bản báo cáo cộng hàng triệu dòng làm cả shop đứng hình. Cách vá không phải máy to hơn, mà là xếp dữ liệu trên ổ đĩa theo kiểu khác.',
    learn: ['OLTP và OLAP: một phép thử để phân biệt', 'Lưu theo dòng và columnar xếp byte trên ổ đĩa ra sao', 'Vì sao lưu theo dòng phí ~98% lượng đọc khi làm báo cáo', 'Vì sao columnar rất dở khi làm việc với từng dòng', 'Bẫy tên gọi: wide-column (Cassandra) ≠ columnar (BigQuery)'],
    state: { v: 'bank', live: true, k: 3, comp: false },
    legend: (i, st) => st.v === 'bank' || st.v === 'end' ? [['var(--green)', 'OLTP: ghi tí xíu'], ['var(--orange)', 'OLAP: đọc cực lớn']] : st.v === 'shape' || st.v === 'wide' ? [['var(--green)', 'một dòng'], ['var(--orange)', 'một cột, mọi dòng']] : st.v === 'try' ? [['var(--rust)', 'đọc mà không dùng'], ['var(--orange)', 'cần dùng (theo dòng)'], ['var(--green-2)', 'phải đọc (columnar)']] : [['var(--yellow)', 'id'], ['var(--blue)', 'name'], ['var(--teal)', 'country'], ['var(--violet)', 'age'], ['var(--orange)', 'salary'], ['var(--rust)', 'bị kéo khỏi ổ đĩa']],
    metrics(i, st) {
      const v = st.v;
      if (v === 'bank') return [['Một giao dịch ATM', '~5 ms'], ['Số dòng mỗi lần rút', '1', 'good'], ['Số dòng mỗi báo cáo', 'hàng triệu', 'bad']];
      if (v === 'shape') return [['Thanh toán đụng tới', '1 dòng', 'good'], ['Báo cáo đụng tới', 'mọi dòng', 'warn'], ['Dữ liệu', 'vẫn vậy']];
      if (v === 'try') {
        const rb = N * 1000, cb = colBytes(st.k) / (st.comp ? 10 : 1);
        return [['Theo dòng phải đọc', '~' + fmt(rb), 'bad'], ['Columnar phải đọc', '~' + fmt(cb), 'good'], ['Đọc ít hơn', '~' + Math.round(rb / cb) + '×', 'good']];
      }
      if (v === 'scan') return [['Byte đọc cho mỗi dòng', '~1 KB', 'bad'], ['Byte thật sự dùng', '~20 B'], ['Lãng phí', '~98%', 'bad']];
      if (v === 'colscan') return [['Số cột phải đọc', '1 / 5'], ['Báo cáo thật', '3 / 50 cột'], ['Byte được bỏ qua', '~94%', 'good']];
      if (v === 'whole') return [['Theo dòng', '1 lần đọc', 'good'], ['Columnar', '~40 lần đọc', 'bad'], ['Thêm 1 dòng', '40 file cột', 'bad']];
      if (v === 'wide') return [['Wide-column', 'OLTP'], ['Columnar', 'OLAP'], ['Chữ dùng chung', '“column”', 'warn']];
      if (v === 'end') return [['Hẹp + sâu', 'theo dòng'], ['Rộng + nông', 'columnar'], ['Warehouse', 'nằm sau, giữ bản sao']];
      return [['Cách lưu', v === 'row' ? 'theo dòng' : 'columnar'], ['Ổ đĩa', 'một hàng byte dài'], ['Mỗi lần đọc', 'một block 8 KB']];
    },
    scene,
    controls(i, st) {
      if (st.v === 'bank') return `<div class="row"><span>Báo cáo của sếp chạy…</span><span class="seg"><button data-act="live" data-v="1" class="${st.live ? 'on' : ''}">thẳng trên DB chính</button><button data-act="live" data-v="0" class="${!st.live ? 'on' : ''}">trên bản sao mỗi đêm</button></span></div>`;
      if (st.v !== 'try') return '';
      return `<div class="row"><label>Số cột query cần: <b>${st.k}</b> / 40</label><input type="range" min="1" max="40" value="${st.k}" data-act="k"></div>
        <div class="row" style="margin-top:6px"><span>Nén columnar (~10×)</span><span class="seg"><button data-act="comp" data-v="0" class="${!st.comp ? 'on' : ''}">tắt</button><button data-act="comp" data-v="1" class="${st.comp ? 'on' : ''}">bật</button></span></div>`;
    },
    act(st, a, v) { if (a === 'live' || a === 'comp') st[a] = !!+v; else st[a] = v; },
    steps: [
      { tag: 'PROBLEM', short: 'Hai kiểu hỏi', set: { v: 'bank', live: true }, learn: 0, title: 'Một máy, hai kiểu câu hỏi không ưa nhau',
        body: `<p>Sếp muốn xem doanh thu theo tháng của ba năm, và trong lúc báo cáo chạy, cả shop đứng hình. Ngân hàng dính đúng chuyện này từ lâu rồi.</p><p><b>~1975.</b> Ngân hàng ghi từng giao dịch: <em>khách #4471 rút $50</em>. Tìm một dòng, trừ đi, lưu lại. ~5 ms, hàng nghìn lần mỗi giây. Kiểu việc này gọi là <b>OLTP</b> (xử lý giao dịch).</p><p><b>~1993.</b> Sếp hỏi: <em>tổng tiền rút theo vùng, theo tháng, trong 3 năm?</em> Query đó quét <b>hàng triệu</b> dòng. Chạy thẳng trên máy chính là mọi ATM đứng hình. Kiểu việc này gọi là <b>OLAP</b> (phân tích).</p><p>Bấm nút bên dưới để xem người ta đã vá thế nào.</p>`,
        idea: ['key', 'Cách vá: <b>mỗi đêm chép dữ liệu</b> sang một máy riêng, gọi là <b>data warehouse</b> (kho dữ liệu để làm báo cáo). Người làm báo cáo quét thoải mái mà không làm chậm ai. Ngày nay người ta vẫn làm y như vậy.'] },
      { tag: 'INSIGHT', short: 'Một phép thử', set: { v: 'shape' }, learn: 0, title: 'Một phép thử: nó đụng tới bao nhiêu dòng?',
        body: `<table><tr><th></th><th>OLTP</th><th>OLAP</th></tr><tr><td>Câu hỏi</td><td>“sửa dòng NÀY, ngay”</td><td>“tính gộp TẤT CẢ các dòng”</td></tr><tr><td>Số dòng</td><td>một / vài dòng</td><td>hàng triệu</td></tr><tr><td>Đọc / ghi</td><td>ghi + đọc từng dòng</td><td>chỉ đọc, quét cả bảng</td></tr><tr><td>Người dùng</td><td>rất nhiều, cùng lúc</td><td>vài người làm báo cáo</td></tr></table><p>Cái phân biệt là <b>kiểu thao tác, không phải app nào</b>. Cùng một dòng sản phẩm: lúc thanh toán chỉ đụng đúng dòng đó, còn báo cáo doanh thu mỗi đêm thì quét qua nó cùng mọi dòng khác.</p>` },
      { tag: 'TECHNIQUE', short: 'Lưu theo dòng', set: { v: 'row' }, learn: 1, title: 'Ổ đĩa là một hàng byte dài',
        body: `<p>Database phải chọn <b>thứ tự</b> xếp các ô lên hàng byte đó. Và ổ đĩa không bao giờ đưa bạn đúng một ô: nó đưa cả một <b>block</b> 8 KB (chính là page ở module 02). Chỉ vì vậy mà cách xếp trở nên quan trọng.</p><p><b>Lưu theo dòng</b> (Postgres, MySQL, SQLite): ghi <b>trọn một dòng rồi mới tới dòng kế</b>. “Lấy khách #2, mọi cột” = một khúc liền nhau = đọc một lần là xong. Quá hợp với OLTP.</p>` },
      { tag: 'TECHNIQUE', short: 'Columnar', set: { v: 'col' }, learn: 1, title: 'Columnar: vẫn các ô đó, gom lại theo cột',
        body: `<p>Nhìn các ô trượt đi. <b>Columnar</b> (lưu theo cột) ghi <b>trọn một cột rồi mới tới cột kế</b>: mọi id, rồi mọi name, rồi mọi country…</p><p>Dữ liệu vẫn vậy, bảng trong SQL vẫn vậy. Chỉ có thứ tự trên ổ đĩa đổi, và nó đổi luôn chuyện câu hỏi nào thì rẻ.</p>` },
      { tag: 'GOTCHA', short: 'Dòng + báo cáo', set: { v: 'scan' }, learn: 2, title: 'Vì sao lưu theo dòng hại báo cáo',
        body: `<p><code>SELECT AVG(salary)</code> chỉ cần một cột. Nhưng khi lưu theo dòng, <b>cứ 5 ô mới có một ô salary</b> (bảng thật thì cứ 40 ô). Ổ đĩa lại đọc theo cả block, nên bạn phải kéo theo mọi cột khác.</p><p>Con số thật: bảng <code>reviews</code> có 2 tỷ dòng × 40 cột, ~1 KB mỗi dòng. Báo cáo chỉ cần 3 cột nhỏ (<code>genre</code>, <code>stars</code>, <code>created_at</code>), khoảng 20 byte. Lưu theo dòng phải kéo ~1 KB để dùng ~20 byte: <b>phí ~98%, đọc tới ≈ 2 TB</b>.</p>`,
        idea: ['myth', '“Tại nhiều dòng quá.” Không phải. Tại <b>phải đọc quá nhiều byte cho mỗi byte dùng được</b>. Index cũng không cứu nổi: query đụng tới mọi dòng, nên planner bỏ qua index và quét hết bảng, và nó làm vậy là đúng.'] },
      { tag: 'INSIGHT', short: 'Columnar thắng', set: { v: 'colscan' }, learn: 2, title: 'Columnar thắng hai lần: bỏ qua và nén',
        body: `<ol style="padding-left:18px;margin:0 0 9px"><li><b>Bỏ qua cột không cần.</b> Báo cáo chỉ đụng 3 trong 50 cột thì bỏ qua được ~94% số byte. Bản báo cáo 2 TB còn <b>≈ 40 GB, đọc ít hơn 50 lần</b>.</li><li><b>Nén.</b> Các ô cạnh nhau cùng kiểu và lặp lại rất nhiều (<code>US,US,US,US</code> → “US ×4”), nên nén thêm được <b>~10 lần</b> nữa.</li></ol><p>Còn một cái lợi: mỗi cột là một dải byte riêng, nên hàng nghìn máy có thể mỗi máy quét một khúc cùng lúc. BigQuery (data warehouse trên cloud của Google) làm đúng như vậy.</p>` },
      { tag: 'TRY IT', short: 'Đếm byte', set: { v: 'try', k: 3, comp: false }, learn: 2, title: 'Kéo thử số cột mà query cần',
        body: `<p>Lưu theo dòng thì lúc nào cũng đọc <b>trọn dòng</b>: ~2 TB, cần mấy cột cũng vậy. Columnar chỉ đọc những cột bạn hỏi tới.</p><p>Thử 3 cột (một báo cáo bình thường), rồi 40 cột (<code>SELECT *</code>). Sau đó bật nén lên.</p>`,
        idea: ['know', 'Với <code>SELECT *</code> trên cả 40 cột, columnar hết lợi thế (chỉ còn nén là giúp được). Columnar thưởng cho những câu hỏi <b>hẹp</b>. Thêm một lý do để đừng bao giờ <code>SELECT *</code> trong warehouse.'] },
      { tag: 'GOTCHA', short: 'Trọn một dòng', set: { v: 'whole' }, learn: 3, title: 'Soi gương: columnar ghét làm việc với từng dòng',
        body: `<p>Hỏi columnar <em>khách #2, mọi cột</em>: dòng đó bị xé ra, mỗi cột nằm một nơi, nên phải đọc ~40 lần mới ráp lại được.</p><ul><li><b>Thêm</b> một review → đụng tới <b>40 file cột</b></li><li><b>Sửa</b> một dòng → ghi lại cả những block đã nén</li></ul><p>Columnar không chỉ chậm với việc từng dòng, nó <b>kỵ</b> hẳn việc đó. Lưu theo dòng và columnar ngược nhau như soi gương: bên này nhanh đúng ở chỗ bên kia chậm.</p>` },
      { tag: 'GOTCHA', short: 'Bẫy tên gọi', set: { v: 'wide' }, learn: 4, title: 'Bẫy tên gọi: wide-column ≠ columnar',
        body: `<p><b>Wide-column</b> (Cassandra, bạn gặp mấy bài trước) là một <b>mô hình dữ liệu</b>: mỗi dòng giống một cuốn từ điển riêng, có thể dài ra tới hàng triệu cột. Các cột của một dòng được lưu <b>cạnh nhau, đã sắp xếp</b>. Nó sinh ra để hứng lượng ghi khổng lồ (ví dụ 500k ping GPS mỗi giây), tức là việc kiểu <b>OLTP</b>.</p><p><b>Columnar</b> (BigQuery) là một <b>cách lưu trên ổ đĩa</b>: giá trị của mỗi cột nằm liền nhau, hợp với <b>OLAP</b>.</p><p>Cùng chữ “column” mà hai nghĩa ngược nhau: <em>“một dòng có thể rất rộng”</em> và <em>“các cột nằm cạnh nhau trên ổ đĩa”</em>.</p>`,
        deep: { title: 'Ví dụ: ping GPS trong một bảng wide-column', html: `<pre>dòng "driver_42":  09:00→(10.77,106.70)  09:01→(10.78,106.70)  ...
                   (hàng triệu cột, dài ra cả ngày)
dòng "driver_99":  08:15→(21.02,105.85)  08:16→(21.02,105.84)
                   (các cột khác hẳn, không sao cả)</pre><ul><li><b>Ghi</b> = cứ nối thêm một cột <code>giờ→(lat,lng)</code> vào dòng của tài xế đó. Không cần đọc trước, không có schema cố định.</li><li><b>Đọc</b> “30 phút gần nhất của driver_42” = một lát liền nhau (các cột sắp xếp theo giờ).</li><li><b>Columnar</b> thì lưu lat của mọi tài xế cạnh nhau: tính “tốc độ trung bình cả đội xe” rất giỏi, còn “nối thêm ping kế tiếp của một tài xế” thì rất dở.</li></ul>` } },
      { tag: 'TAKEAWAY', short: 'Kiểu hỏi', set: { v: 'end' }, title: 'Kiểu câu hỏi chọn cách lưu; warehouse nằm phía sau',
        body: `<ul><li><b>OLTP hay OLAP</b>: thao tác đó đụng tới bao nhiêu dòng?</li><li><b>Hẹp mà sâu</b> (một dòng, mọi cột) thì lưu theo <b>dòng</b>. <b>Rộng mà nông</b> (mọi dòng, vài cột) thì lưu theo <b>cột</b>.</li><li>Warehouse columnar là một <b>bản sao</b> của database OLTP: mỗi đêm chép sang một lần, hoặc chép liên tục (module 10). Không bao giờ có chiều ngược lại.</li></ul><p>Chỗ còn đau: giờ bạn có một database chính và mấy bản sao của nó ở các dạng khác (cache, search, warehouse). Làm sao để các bản sao luôn đúng? Module 10 lo chuyện đó.</p>`,
        idea: ['key', 'Dòng hay cột là chuyện <b>kiểu câu hỏi, không phải chuyện dữ liệu lớn cỡ nào</b>. Không có cách lưu “tốt nhất”, chỉ có cách hợp với việc cần làm.'],
