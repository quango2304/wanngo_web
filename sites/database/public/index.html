<style>
.wg{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;flex:none}
.wg img{width:28px;height:28px;border:1.5px solid var(--ink);border-radius:8px;background:#fbf6ef;image-rendering:pixelated;box-shadow:1.5px 2px 0 rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.wg:hover img{transform:rotate(-8deg) scale(1.06)}
.wg span{display:flex;flex-direction:column;line-height:1.15}
.wg small{font-size:9.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.wg b{font-size:12.5px;font-weight:800}
@media (max-width:520px){.wg span{display:none}}

<style>
:root{
  --paper:#f3ece1;--sheet:#f8f2e9;--card:#fbf7f0;--card-2:#f4ede2;
  --line:#dcd2c3;--line-soft:#e8e0d3;--line-strong:#c4b8a6;
  --ink:#1f1c18;--ink-2:#3a352e;--muted:#6d665c;--muted-2:#8e867a;
  --green:#d3e6b8;--green-2:#b5d695;--green-ink:#2f6b2a;
  --violet:#e6dcf4;--violet-ink:#5b44a3;
  --orange:#fbdcbf;--orange-ink:#9a5212;
  --blue:#d6e6f6;--blue-ink:#1f5f99;
  --teal:#d2efe9;--teal-ink:#1c6e64;
  --rose:#f8d6d0;--rose-ink:#9b2c22;
  --yellow:#fbecc0;--yellow-ink:#7a5a0c;
  --rust:#cf6436;
  --drop:#1f1c18;
  --grid:#e2d9cb;
  --hl:#c8e3a8;
  --font:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --paper:#1f1c18;--sheet:#25211c;--card:#2a2620;--card-2:#231f1a;
    --line:#3a342c;--line-soft:#2e2923;--line-strong:#554c41;
    --ink:#efe6d6;--ink-2:#d9cfbe;--muted:#a69c8d;--muted-2:#8a7f70;
    --green:#3d4c2b;--green-2:#4f6137;--green-ink:#9fd68f;
    --violet:#433456;--violet-ink:#c3b2ef;
    --orange:#56402c;--orange-ink:#f2b27a;
    --blue:#2b3f55;--blue-ink:#9ac6f0;
    --teal:#24463f;--teal-ink:#8fdcce;
    --rose:#55312b;--rose-ink:#f2a89c;
    --yellow:#4f4329;--yellow-ink:#f0d28a;
    --rust:#e07a4b;--drop:#050403;--grid:#2c2822;--hl:#4b6234;
    color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --paper:#1f1c18;--sheet:#25211c;--card:#2a2620;--card-2:#231f1a;
  --line:#3a342c;--line-soft:#2e2923;--line-strong:#554c41;
  --ink:#efe6d6;--ink-2:#d9cfbe;--muted:#a69c8d;--muted-2:#8a7f70;
  --green:#3d4c2b;--green-2:#4f6137;--green-ink:#9fd68f;
  --violet:#433456;--violet-ink:#c3b2ef;
  --orange:#56402c;--orange-ink:#f2b27a;
  --blue:#2b3f55;--blue-ink:#9ac6f0;
  --teal:#24463f;--teal-ink:#8fdcce;
  --rose:#55312b;--rose-ink:#f2a89c;
  --yellow:#4f4329;--yellow-ink:#f0d28a;
  --rust:#e07a4b;--drop:#050403;--grid:#2c2822;--hl:#4b6234;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:var(--font);background:var(--card-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.92em;white-space:normal;overflow-wrap:anywhere}
pre{font-family:var(--font);background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:12.5px;line-height:1.5;margin:8px 0;white-space:pre}
pre code{background:none;border:0;padding:0;white-space:pre}
b,strong{font-weight:700}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.iconbtn{width:36px;height:36px;border:1.3px solid var(--ink-2);background:var(--card);border-radius:9px;box-shadow:0 1.5px 0 var(--drop);display:inline-grid;place-items:center;flex:none}
.iconbtn:active{transform:translateY(1px);box-shadow:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand .hl{font-weight:800}
.tabs{display:flex;gap:6px;margin-left:6px}
.tabs button{border:1.3px solid transparent;background:none;border-radius:8px;padding:6px 10px;font-weight:600;color:var(--muted)}
.tabs button.on{border-color:var(--ink);background:var(--green);color:var(--ink);box-shadow:1.5px 2px 0 var(--drop)}
.spacer{flex:1}
.search{position:relative;flex:0 1 220px;min-width:110px}
.search input{width:100%;height:36px;border:1.3px solid var(--line-strong);background:var(--card);border-radius:9px;padding:0 10px 0 30px;font:inherit;color:var(--ink)}
.search svg{position:absolute;left:9px;top:10px;opacity:.6}
.pbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.pbar .track{width:70px;height:7px;border:1.2px solid var(--ink-2);border-radius:5px;overflow:hidden;background:var(--card)}
.pbar .fill{height:100%;background:var(--green-2);width:0;transition:width .4s}

/* ---------- layout: see LAYOUT block at end ---------- */
/* ---------- sidebar ---------- */
.side-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin:2px 4px 10px;font-size:14px}
.side-h span{font-weight:500;color:var(--muted);font-size:12px}
.mod{margin-bottom:4px}
.mod-btn{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 6px;border-radius:8px;font-weight:700}
.mod-btn:hover{background:var(--card-2)}
.mod-btn .sw{width:13px;height:11px;border-radius:2px;border:1.2px solid var(--ink-2);flex:none}
.mod-btn .cnt{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px}
.mod-btn .car{width:10px;transition:transform .2s;flex:none;opacity:.7}
.mod.open .mod-btn .car{transform:rotate(90deg)}
.mod ul{list-style:none;margin:2px 0 6px 14px;padding:0 0 0 10px;border-left:1.3px dashed var(--line-strong);display:none}
.mod.open ul{display:block}
.mod li button{display:flex;gap:8px;align-items:flex-start;width:100%;border:1.3px solid transparent;background:none;text-align:left;padding:5px 8px;border-radius:8px;font-size:12.5px;line-height:1.35}
.mod li button:hover{background:var(--card-2)}
.mod li button.on{background:var(--green);border-color:var(--ink);box-shadow:1.5px 2px 0 var(--drop);font-weight:700}
.mod li .ck{flex:none;width:13px;height:13px;margin-top:2px;border:1.2px solid var(--muted-2);border-radius:3px;display:grid;place-items:center;font-size:9px}
.mod li .ck.done{background:var(--green-2);border-color:var(--ink-2)}
.mod li.hide{display:none}
.side-foot{margin-top:14px;border:1.3px solid var(--line-strong);border-radius:10px;padding:10px 12px;background:var(--card);font-size:12px;color:var(--muted)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1.3px solid var(--line-strong);border-radius:12px;box-shadow:0 1px 0 var(--line),0 10px 22px -18px rgba(0,0,0,.35)}

/* ---------- lesson ---------- */
.crumb{font-size:12px;color:var(--muted);margin:2px 0 4px}
.lhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:2px}
.lhead h1{font-size:23px;line-height:1.25;margin:0;letter-spacing:-.015em;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.3px solid var(--ink-2);border-radius:8px;padding:2px 9px;font-size:12px;font-weight:600;box-shadow:0 1.5px 0 var(--drop);white-space:nowrap}
.chip.y{background:var(--yellow)}.chip.g{background:var(--green)}.chip.v{background:var(--violet)}
.lsub{color:var(--muted);margin:2px 0 12px}
.stage{padding:10px;position:relative;overflow:hidden}
.metrics{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px;min-height:46px}
.metric{border:1.3px solid var(--line-strong);background:var(--sheet);border-radius:9px;padding:4px 10px 5px;min-width:96px;box-shadow:0 1.5px 0 var(--line-strong)}
.metric .ml{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.metric .mv{font-size:15px;font-weight:800;line-height:1.25}
.metric.bad{border-left:4px solid var(--rust)}.metric.bad .mv{color:var(--rust)}
.metric.good{border-left:4px solid var(--green-ink)}.metric.good .mv{color:var(--green-ink)}
.metric.warn{border-left:4px solid var(--orange-ink)}.metric.warn .mv{color:var(--orange-ink)}
.metric.flash{animation:flash .7s}
@keyframes flash{0%{background:var(--yellow)}100%{background:var(--sheet)}}
.svgwrap{border-radius:9px;overflow-x:auto;overflow-y:hidden;background:var(--sheet);border:1px solid var(--line-soft)}
svg.scene{display:block;width:100%;min-width:540px;height:auto;font-family:var(--font)}
svg.scene text{font-family:var(--font);fill:var(--ink)}
svg.scene *{transition:transform .65s cubic-bezier(.3,.7,.2,1),opacity .45s,fill .45s,stroke .45s}
svg.scene .enter{animation:enter .5s cubic-bezier(.3,.7,.2,1)}
svg.scene .exit{opacity:0 !important;transition:opacity .3s}
@keyframes enter{from{opacity:0}}
svg.scene .march{stroke-dasharray:6 5;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-22}}
svg.scene .pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.paused svg.scene *{animation-play-state:paused !important}
.stagefoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.2px solid var(--ink-2);margin-right:5px;vertical-align:-1px}
.tools{display:flex;gap:6px}
.tools .iconbtn{width:32px;height:32px}
.try{margin-top:10px;border:1.3px dashed var(--green-ink);border-radius:10px;padding:8px 10px;background:color-mix(in srgb,var(--green) 35%,transparent);display:none}
.try.on{display:block}
.try .tl{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--green-ink);margin-bottom:5px}
.try .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1.3px solid var(--ink-2);border-radius:8px;overflow:hidden;box-shadow:0 1.5px 0 var(--drop);flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:5px 10px;font-weight:600;font-size:12.5px;border-right:1px solid var(--line-strong)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--green-2);color:#1f1c18}
.tbtn{border:1.3px solid var(--ink-2);background:var(--card);border-radius:8px;padding:5px 11px;font-weight:600;font-size:12.5px;box-shadow:0 1.5px 0 var(--drop)}
.tbtn.on{background:var(--green-2);color:#1f1c18}
.tbtn:active{transform:translateY(1px);box-shadow:none}
input[type=range]{accent-color:var(--green-ink);width:min(260px,100%)}
.try label{font-size:12.5px;font-weight:600}

.stepper{padding:10px 14px 12px}
.stepper .sh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.stepper .sh b{letter-spacing:.06em}
.stepper .sh span{color:var(--muted)}
.dots{display:flex;align-items:flex-start;overflow-x:auto;padding:2px 2px 20px}
.dot{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;position:relative;min-width:34px;border:0;background:none;padding:0}
.dot::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:1.5px;background:var(--line-strong);z-index:0}
.dot:first-child::before{display:none}
.dot.past::before,.dot.cur::before{background:var(--ink-2);height:2px}
.dot .n{position:relative;z-index:1;width:27px;height:27px;border-radius:50%;border:1.3px solid var(--ink-2);background:var(--card);display:grid;place-items:center;font-size:11.5px;font-weight:700}
.dot.past .n{background:var(--green)}
.dot.cur .n{background:var(--green-2);color:#1f1c18;box-shadow:0 0 0 3px var(--green);font-weight:800}
.dot .lab{position:absolute;top:31px;font-size:10.5px;font-weight:700;white-space:nowrap;visibility:hidden}
.dot:first-child .lab{left:0}.dot:last-child .lab{right:0}
.dot.cur .lab{visibility:visible}

.panel{padding:14px 16px;min-width:0;overflow-wrap:break-word}
.qcard,.ccard{min-width:0;overflow-wrap:break-word}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ph .sn{font-size:12px;font-weight:700;letter-spacing:.06em}
.tag{border:1.3px solid currentColor;border-radius:7px;padding:1px 8px;font-size:10.5px;font-weight:800;letter-spacing:.07em}
.tag.problem{color:var(--rose-ink);background:var(--rose)}
.tag.insight{color:var(--violet-ink);background:var(--violet)}
.tag.technique{color:var(--blue-ink);background:var(--blue)}
.tag.gotcha{color:var(--orange-ink);background:var(--orange)}
.tag.try{color:var(--green-ink);background:var(--green)}
.tag.takeaway{color:var(--ink);background:var(--yellow)}
.tag.case{color:var(--teal-ink);background:var(--teal)}
.panel h2{font-size:18px;line-height:1.3;margin:4px 0 8px;letter-spacing:-.01em}
.pbody p{margin:0 0 9px}
.pbody ul{margin:0 0 9px;padding-left:18px}
.pbody li{margin:2px 0}
.pbody table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0 10px;display:block;overflow-x:auto;max-width:100%}
.pbody th,.pbody td{border:1px solid var(--line-strong);padding:4px 6px;text-align:left;vertical-align:top}
.pbody th{background:var(--card-2)}
.idea{display:flex;gap:10px;border:1.3px solid var(--line-strong);border-radius:10px;padding:9px 11px;margin:10px 0 4px}
.idea>div:last-child{min-width:0;overflow-wrap:anywhere}
.idea .ic{flex:none;width:28px;height:28px;border:1.3px solid var(--ink-2);border-radius:7px;display:grid;place-items:center;background:var(--card);font-size:14px}
.idea .il{font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin-bottom:1px}
.idea.key{background:var(--violet);border-color:color-mix(in srgb,var(--violet-ink) 35%,transparent)}
.idea.know{background:var(--green);border-color:color-mix(in srgb,var(--green-ink) 35%,transparent)}
.idea.warn{background:var(--orange);border-color:color-mix(in srgb,var(--orange-ink) 35%,transparent)}
.idea.myth{background:var(--rose);border-color:color-mix(in srgb,var(--rose-ink) 35%,transparent)}
details.deep{margin:10px 0 2px;border:1.3px solid var(--line-strong);border-radius:10px;background:var(--sheet)}
details.deep summary{cursor:pointer;padding:7px 11px;font-weight:700;font-size:12.5px;list-style:none}
details.deep summary::-webkit-details-marker{display:none}
details.deep summary::before{content:"▸ ";display:inline-block;transition:transform .2s}
details.deep[open] summary::before{transform:rotate(90deg)}
details.deep .dc{padding:0 11px 9px}
.pnav{display:flex;gap:8px;margin-top:12px}
.btn-ghost{border:1.3px solid var(--ink-2);background:var(--card);height:38px;border-radius:8px;padding:0 14px;font-weight:600;box-shadow:0 1.5px 0 var(--drop);display:inline-flex;align-items:center;gap:6px}
.btn-ghost:disabled{opacity:.4;cursor:default}
.btn-pop{flex:1;border:1.5px solid var(--ink);background:var(--green);border-radius:8px;min-height:38px;padding:4px 14px;font-weight:700;box-shadow:1.5px 2.5px 0 var(--drop);display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;line-height:1.2}
.btn-pop:active,.btn-ghost:active{transform:translate(1px,1px);box-shadow:none}
.kbd{font-size:11px;color:var(--muted);margin-top:7px;text-align:center}
.kbd span{border:1px solid var(--line-strong);border-radius:4px;padding:0 4px;background:var(--sheet)}
.learn{padding:12px 16px}
.learn h3,.sec-h{font-size:12px;letter-spacing:.07em;margin:0 0 8px;font-weight:800}
.learn ul{list-style:none;margin:0;padding:0}
.learn li{display:flex;gap:9px;margin:5px 0;color:var(--muted);font-size:12.5px;line-height:1.4}
.learn li .ck{flex:none;width:15px;height:15px;border:1.3px solid var(--muted-2);border-radius:3px;display:grid;place-items:center;font-size:10px;margin-top:1px}
.learn li.on{color:var(--ink)}
.learn li.on .ck{background:var(--green-2);border-color:var(--ink-2);color:#1f1c18}

/* ---------- practice / cheatsheet ---------- */
.view-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin:4px 0 12px}
.view-h h1{margin:0;font-size:23px;letter-spacing:-.015em}
.view-h p{margin:0;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1.3px solid var(--line-strong);background:var(--card);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600}
.filters button.on{border-color:var(--ink);background:var(--green);box-shadow:1.5px 2px 0 var(--drop)}
.qgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@container (min-width:900px){.qgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.qcard{padding:13px 15px}
.qcard .qm{font-size:11px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.qcard .qq{font-weight:700;margin-bottom:8px;line-height:1.45}
.qopt{display:block;width:100%;text-align:left;border:1.3px solid var(--line-strong);background:var(--sheet);border-radius:8px;padding:7px 10px;margin:5px 0;font-size:12.5px;line-height:1.4}
.qopt:hover{border-color:var(--ink-2)}
.qopt.right{background:var(--green);border-color:var(--green-ink)}
.qopt.wrong{background:var(--rose);border-color:var(--rose-ink)}
.qopt .ow{display:block;font-weight:400;font-size:12px;margin-top:4px;color:var(--ink-2)}
.qwhy{display:none;margin-top:8px;border-left:3px solid var(--green-ink);padding:4px 10px;background:var(--card-2);border-radius:0 8px 8px 0;font-size:12.5px}
.qcard.answered .qwhy{display:block}
.qcard.answered .qopt{cursor:default}
.linkbtn{border:0;background:none;padding:0;color:var(--blue-ink);text-decoration:underline;font-size:11px}
.score{font-weight:800}
.cgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@container (min-width:760px){.cgrid{grid-template-columns:1fr 1fr}}
@container (min-width:1200px){.cgrid{grid-template-columns:1fr 1fr 1fr}}
.ccard{padding:12px 15px;border-top:6px solid var(--mc,var(--ink))}
.ccard h3{margin:0 0 6px;font-size:14.5px}
.ccard ul{margin:0;padding-left:17px}
.ccard li{margin:4px 0;font-size:12.5px;line-height:1.45}
.ccard .one{font-weight:700;background:var(--sheet);border:1px dashed var(--line-strong);border-radius:8px;padding:6px 9px;margin:4px 0 8px;font-size:12.5px}
.wide{grid-column:1/-1}
.hidden{display:none !important}

/* =================== LAYOUT ===================
   desktop/tablet: the window is exactly the viewport; every region scrolls inside itself.
   stack (phones, short panes): natural page scroll, step nav pinned as a bottom bar.     */
html,body{height:100%}
.top{position:sticky;top:0}
.body{display:flex;align-items:flex-start}
#side{width:272px;flex:none;padding:14px 10px 18px 14px;border-right:1px solid var(--line);background:var(--paper);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
#main{flex:1;min-width:0;padding:14px 16px;container-type:inline-size}
.backdrop{display:none}
.crumbrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 2px}
.crumb{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lnav{display:flex;gap:6px;flex:none}
.lnav button{border:1.2px solid var(--line-strong);background:var(--card);border-radius:7px;padding:2px 9px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.lnav button:hover{border-color:var(--ink-2)}
.lnav button:disabled{opacity:.35;cursor:default}
.sheet,.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.pcontent{min-width:0}
.vscroll{min-width:0}
.scroll-thin{scrollbar-width:thin}

:root:is([data-layout=desktop],[data-layout=tablet]) body{overflow:hidden}
:root:is([data-layout=desktop],[data-layout=tablet]) .app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
:root:is([data-layout=desktop],[data-layout=tablet]) .top{position:relative;flex:none}
:root:is([data-layout=desktop],[data-layout=tablet]) .body{flex:1;min-height:0;align-items:stretch}
:root:is([data-layout=desktop],[data-layout=tablet]) #main{display:flex;flex-direction:column;min-height:0;padding:12px 14px 14px}
:root:is([data-layout=desktop],[data-layout=tablet]) .lesson{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px}
[data-layout=tablet] .lesson{grid-template-columns:minmax(0,1fr) 310px}
:root:is([data-layout=desktop],[data-layout=tablet]) .sheet{min-height:0}
:root:is([data-layout=desktop],[data-layout=tablet]) .lhead-wrap{flex:none}
:root:is([data-layout=desktop],[data-layout=tablet]) .lhead h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
:root:is([data-layout=desktop],[data-layout=tablet]) .lhead{flex-wrap:nowrap}
:root:is([data-layout=desktop],[data-layout=tablet]) .lsub{margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root:is([data-layout=desktop],[data-layout=tablet]) .stage{flex:1;min-height:0;display:flex;flex-direction:column}
:root:is([data-layout=desktop],[data-layout=tablet]) .metrics{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-height:0}
:root:is([data-layout=desktop],[data-layout=tablet]) .metrics::-webkit-scrollbar{display:none}
:root:is([data-layout=desktop],[data-layout=tablet]) .metric{flex:none}
:root:is([data-layout=desktop],[data-layout=tablet]) .svgwrap{flex:1;min-height:140px;overflow:hidden;display:flex}
:root:is([data-layout=desktop],[data-layout=tablet]) svg.scene{min-width:0;width:100%;height:100%}
:root:is([data-layout=desktop],[data-layout=tablet]) .stagefoot{flex:none}
:root:is([data-layout=desktop],[data-layout=tablet]) .try{flex:none;max-height:36%;overflow-y:auto;scrollbar-width:thin}
:root:is([data-layout=desktop],[data-layout=tablet]) .stepper{flex:none}
:root:is([data-layout=desktop],[data-layout=tablet]) .rail{min-height:0}
:root:is([data-layout=desktop],[data-layout=tablet]) .panel{flex:1;min-height:0;display:flex;flex-direction:column}
:root:is([data-layout=desktop],[data-layout=tablet]) .ph{flex:none}
:root:is([data-layout=desktop],[data-layout=tablet]) .pcontent{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;margin:0 -10px;padding:0 10px 4px;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 18px),transparent);mask-image:linear-gradient(#000 calc(100% - 18px),transparent)}
:root:is([data-layout=desktop],[data-layout=tablet]) .pnav{flex:none;margin-top:10px}
:root:is([data-layout=desktop],[data-layout=tablet]) .learn{flex:none;height:clamp(118px,27%,210px);overflow-y:auto;scrollbar-width:thin}
:root:is([data-layout=desktop],[data-layout=tablet]) .vscroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;margin:-12px -14px -14px;padding:12px 14px 20px}
@media (max-height:760px){
  :root:is([data-layout=desktop],[data-layout=tablet]) .lsub{display:none}
  :root:is([data-layout=desktop],[data-layout=tablet]) .stepper{padding:7px 12px 8px}
  :root:is([data-layout=desktop],[data-layout=tablet]) .stepper .sh{margin-bottom:4px}
  :root:is([data-layout=desktop],[data-layout=tablet]) .learn{height:clamp(100px,22%,170px)}
  :root:is([data-layout=desktop],[data-layout=tablet]) .metric{padding:2px 9px 3px}
  :root:is([data-layout=desktop],[data-layout=tablet]) .metric .mv{font-size:13.5px}
}
/* desktop: sidebar is a column (collapsible); tablet/stack: a slide-in drawer */
[data-layout=desktop] #side{position:static}
[data-layout=desktop] .app.side-closed #side{display:none}
:root:is([data-layout=tablet],[data-layout=stack]) #side{position:fixed;top:var(--toph,0px);bottom:0;left:0;z-index:60;width:min(320px,88vw);max-height:none;transform:translateX(-105%);transition:transform .25s cubic-bezier(.3,.7,.2,1);border-right:1.5px solid var(--ink);box-shadow:0 0 60px -18px rgba(0,0,0,.6)}
:root:is([data-layout=tablet],[data-layout=stack]) .app.side-open #side{transform:none}
:root:is([data-layout=tablet],[data-layout=stack]) .backdrop{display:block;position:fixed;inset:var(--toph,0px) 0 0 0;z-index:55;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s}
:root:is([data-layout=tablet],[data-layout=stack]) .app.side-open .backdrop{opacity:1;pointer-events:auto}
/* stack: page scrolls; stage keeps its own horizontal scroll; step nav = fixed bottom bar */
[data-layout=stack] .app{padding-bottom:74px}
[data-layout=stack] .rail{margin-top:12px}
[data-layout=stack] .svgwrap{overflow-x:auto}
[data-layout=stack] svg.scene{min-width:540px}
[data-layout=stack] .pnav{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;padding:10px max(12px,calc((100vw - 640px)/2)) 12px;background:var(--paper);border-top:1px solid var(--line-strong);box-shadow:0 -10px 24px -18px rgba(0,0,0,.35)}
[data-layout=stack] .kbd{display:none}
[data-layout=stack] .lsub{margin-bottom:10px}
:root:is([data-layout=desktop],[data-layout=tablet]) .top{flex-wrap:nowrap}
@media (max-width:1180px){ .brand .hl{display:none} .search{flex:0 1 190px} }
@media (max-width:1000px){ .pbar{display:none} }
@media (max-width:820px){ .tabs button{padding:6px 8px} }
@media (max-width:640px){ .tabs{order:5;width:100%;margin:0} .tabs button{flex:1} .search{order:6;flex:1 1 100%} }

/* ---- stage chrome: tools top-right, thin legend line, compact try box ---- */
.stage{position:relative}
.stagehead{display:flex;align-items:flex-start;gap:8px;flex:none}
.stagehead .metrics{flex:1;min-width:0;margin-bottom:6px}
.tools{flex:none;display:flex;gap:6px}
.tools .iconbtn{width:30px;height:30px}
.stagefoot{margin-top:6px}
.legend{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;white-space:nowrap;font-size:11px;gap:12px}
.legend::-webkit-scrollbar{display:none}
.try{margin-top:8px;padding:6px 9px;display:none;align-items:flex-start;gap:10px}
.try.on{display:flex}
.try .tl{flex:none;margin:5px 0 0;font-size:9.5px}
.try .tc{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.try .row{gap:6px}
.try .tbtn,.try .seg button{padding:3px 9px;font-size:12px}
.try label,.try span{font-size:12px}
.try input[type=range]{width:min(220px,100%)}
/* lesson header: title may take 2 lines, chips never stack */
.lhead{flex-wrap:nowrap;align-items:flex-start}
.lhead h1{flex:1;min-width:0}
.lhead .chips{flex:none;flex-wrap:nowrap;margin-top:3px}
:root:is([data-layout=desktop],[data-layout=tablet]) .lhead h1{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
@container (max-width:620px){ .lhead{flex-wrap:wrap} .lhead .chips{flex-wrap:wrap} }
[data-layout=stack] .lhead{flex-wrap:wrap}
[data-layout=stack] .try{flex-direction:column;gap:4px}

/* step nav: identical size on every step → identical position */
.pnav .btn-pop,.pnav .btn-ghost{height:40px;min-height:40px}
.btn-pop span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-pop span:last-child{flex:none}

/* short panes: give the diagram the height */
@media (max-height:680px){
  :root:is([data-layout=desktop],[data-layout=tablet]) .stepper .sh{display:none}
  :root:is([data-layout=desktop],[data-layout=tablet]) .stepper{padding:6px 10px 2px}
  :root:is([data-layout=desktop],[data-layout=tablet]) .stagefoot{display:none}
  :root:is([data-layout=desktop],[data-layout=tablet]) .try{max-height:30%;margin-top:6px}
  :root:is([data-layout=desktop],[data-layout=tablet]) .lhead h1{font-size:18px;-webkit-line-clamp:1}
  :root:is([data-layout=desktop],[data-layout=tablet]) #main{padding-top:8px}
  :root:is([data-layout=desktop],[data-layout=tablet]) .sheet,:root:is([data-layout=desktop],[data-layout=tablet]) .rail{gap:8px}
}

@media (max-width:1000px){ :root:is([data-layout=desktop],[data-layout=tablet]) .lhead .chip.g,:root:is([data-layout=desktop],[data-layout=tablet]) .lhead .chip.v{display:none} }

:root:is([data-layout=desktop],[data-layout=tablet]) .vscroll .filters{position:sticky;top:-12px;z-index:5;background:var(--paper);margin:0 -14px 12px;padding:8px 14px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<script>(function(){var w=innerWidth,h=innerHeight;document.documentElement.dataset.layout=w>=1100&&h>=560?"desktop":w>=760&&h>=520?"tablet":"stack";})();</script>
<div class="app" id="app">
  <header class="top">
    <button class="iconbtn" id="menuBtn" title="Course menu" aria-label="Course menu"><svg width="16" height="14" viewBox="0 0 16 14"><path d="M1 2h14M1 7h14M1 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26"><ellipse cx="13" cy="6" rx="9" ry="3.4" fill="var(--green)" stroke="var(--ink)" stroke-width="1.5"/><path d="M4 6v13c0 1.9 4 3.4 9 3.4s9-1.5 9-3.4V6" fill="var(--green)" stroke="var(--ink)" stroke-width="1.5"/><path d="M4 12.5c0 1.9 4 3.4 9 3.4s9-1.5 9-3.4" fill="none" stroke="var(--ink)" stroke-width="1.5"/></svg><span>Databases</span> <span class="hl">step by step</span></div>
    <nav class="tabs" id="tabs"><button data-view="learn" class="on">Learn</button><button data-view="practice">Practice</button><button data-view="cheat">Cheatsheet</button></nav>
    <div class="spacer"></div>
    <div class="search"><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Search lessons & concepts" autocomplete="off"></div>
    <div class="pbar" title="Lessons finished"><span id="pText">0/0</span><div class="track"><div class="fill" id="pFill"></div></div></div>
    <button class="iconbtn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
    <a class="wg" href="https://wanngo.com/" title="wanngo.com"><img src="/wanngo.png" alt="" width="28" height="28"><span><small>more from</small><b>wanngo.com</b></span></a>
  </header>
  <div class="body">
    <div class="backdrop" id="backdrop"></div>
    <aside id="side" class="scroll-thin"></aside>
    <main id="main"></main>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   SQL step by step — engine
   Lessons register with L(moduleId, def). Practice with Q(), cheatsheet with CHEAT().
   A lesson's scene(i, st) returns SVG markup; every top-level element (and any nested
   element) with an id is MORPHED in place between steps, so transform / opacity / fill
   changes animate via CSS transitions. Position things with style transform (S.* do this).
   ===================================================================== */
const SVGNS = 'http://www.w3.org/2000/svg';
const MODULES = [
  { id: 'm1', n: '01', title: 'A file is not enough', color: 'var(--card-2)', one: 'A text file fails three ways: slow to search, broken by a crash, overwritten by two writers. A database is the fix for all three.' },
  { id: 'm2', n: '02', title: 'Find it fast', color: 'var(--orange)', one: 'Disks hand out whole pages. Every speed trick is a way to read fewer of them.' },
  { id: 'm3', n: '03', title: 'Keep it safe', color: 'var(--yellow)', one: 'Write the change to a log first. Then a crash can never leave half a change behind.' },
  { id: 'm4', n: '04', title: 'Share it safely', color: 'var(--blue)', one: 'Many users at once: keep several versions of a row, and choose how much overlap you can tolerate.' },
  { id: 'm5', n: '05', title: 'Give data a shape', color: 'var(--green-2)', one: 'Every fact lives exactly once, in the table of the thing it describes.' },
  { id: 'm6', n: '06', title: 'Ask questions (SQL)', color: 'var(--violet)', one: 'Say what you want, not how to get it. The database runs your query through one fixed pipeline.' },
  { id: 'm7', n: '07', title: 'Make queries fast', color: 'var(--teal)', one: 'Most slow queries do work once per row that should be done once per set, or search without a usable index.' },
  { id: 'm8', n: '08', title: 'More than one machine', color: 'var(--rose)', one: 'Copies multiply readers, shards divide writers, and a cut cable forces a choice: errors or stale data.' },
  { id: 'm9', n: '09', title: 'Other kinds of databases', color: 'var(--line-strong)', one: 'Each one does the work at write time so one kind of read is nearly free. The price: you must know the question in advance.' },
  { id: 'm10', n: '10', title: 'Putting it together', color: 'var(--green)', one: 'One source of truth, specialists fed from it, and a ladder from cheap fixes to expensive ones.' },
];
const LESSONS = [], QUESTIONS = [], CHEATS = {};
let _reg = 0;
function L(mod, def) { def.mod = mod; def._r = _reg++; LESSONS.push(def); }
function Q(mod, def) { def.mod = mod; QUESTIONS.push(def); }
function CHEAT(mod, html) { (CHEATS[mod] = CHEATS[mod] || []).push(html); }
const cheatHtml = (mod, fold) => { const b = CHEATS[mod] || []; if (!fold || b.length < 2) return b.join(''); return b[0] + `<details class="deep"><summary>More detail (${b.length - 1} more lesson${b.length > 2 ? 's' : ''})</summary><div class="dc">${b.slice(1).join('')}</div></details>`; };

/* ---------------- helpers ---------------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const TONES = {
  card: ['var(--card)', 'var(--ink)'], paper: ['var(--sheet)', 'var(--ink)'],
  green: ['var(--green)', 'var(--green-ink)'], green2: ['var(--green-2)', 'var(--ink)'],
  violet: ['var(--violet)', 'var(--violet-ink)'], orange: ['var(--orange)', 'var(--orange-ink)'],
  blue: ['var(--blue)', 'var(--blue-ink)'], teal: ['var(--teal)', 'var(--teal-ink)'],
  rose: ['var(--rose)', 'var(--rose-ink)'], yellow: ['var(--yellow)', 'var(--yellow-ink)'],
  ink: ['var(--ink)', 'var(--paper)'], none: ['none', 'var(--ink)'],
};
const tone = t => TONES[t] || [t || 'var(--card)', 'var(--ink)'];
const CW = 0.6; // monospace char width as fraction of font size
const tw = (s, size = 12) => String(s).length * size * CW;

/* ---------------- SVG kit ----------------
   All position via transform so moves animate. Common opts:
   op (opacity 0..1), tone (see TONES), dash (bool), cls (extra class)            */
const S = {
  st(x, y, op) { return `style="transform:translate(${x}px,${y}px)${op != null ? `;opacity:${op}` : ''}"`; },
  /* box with hard drop shadow. label may contain \n. o: tone, sub, r, flat, dash, size, inner, op, align */
  box(id, x, y, w, h, o = {}) {
    const [f] = tone(o.tone || 'card');
    const r = o.r ?? 9, size = o.size || 13;
    const lines = o.label != null ? String(o.label).split('\n') : [];
    const subs = o.sub != null ? String(o.sub).split('\n') : [];
    const total = lines.length * (size + 3) + subs.length * 14;
    let ty = h / 2 - total / 2 + size - 1;
    let t = '';
    for (const ln of lines) { t += `<text x="${w / 2}" y="${ty}" text-anchor="middle" font-size="${size}" font-weight="800">${esc(ln)}</text>`; ty += size + 3; }
    for (const ln of subs) { t += `<text x="${w / 2}" y="${ty}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${esc(ln)}</text>`; ty += 14; }
    return `<g id="${id}" ${S.st(x, y, o.op)}${o.cls ? ` class="${o.cls}"` : ''}>${o.flat ? '' : `<rect x="2" y="3" width="${w}" height="${h}" rx="${r}" fill="var(--drop)"/>`}<rect width="${w}" height="${h}" rx="${r}" style="fill:${f}" stroke="${o.stroke || 'var(--ink)'}" stroke-width="${o.sw || 1.5}"${o.dash ? ' stroke-dasharray="5 4"' : ''}/>${t}${o.inner || ''}</g>`;
  },
  /* database cylinder */
  db(id, x, y, w, h, o = {}) {
    const [f] = tone(o.tone || 'green'); const ry = Math.min(9, h / 6);
    const body = `M0 ${ry}v${h - 2 * ry}a${w / 2} ${ry} 0 0 0 ${w} 0v${-(h - 2 * ry)}`;
    const ly = o.sub ? h / 2 + ry / 2 - 2 : h / 2 + ry / 2 + 4;
    const lab = o.label != null ? `<text x="${w / 2}" y="${ly}" text-anchor="middle" font-size="${o.size || 12}" font-weight="800">${esc(o.label)}</text>` : '';
    const sub = o.sub ? `<text x="${w / 2}" y="${ly + 13}" text-anchor="middle" font-size="10.5" style="fill:var(--muted)">${esc(o.sub)}</text>` : '';
    return `<g id="${id}" ${S.st(x, y, o.op)}${o.cls ? ` class="${o.cls}"` : ''}><path d="${body}" transform="translate(2,3)" fill="var(--drop)"/><path d="${body}" style="fill:${f}" stroke="var(--ink)" stroke-width="1.5"/><ellipse cx="${w / 2}" cy="${ry}" rx="${w / 2}" ry="${ry}" style="fill:${f}" stroke="var(--ink)" stroke-width="1.5"/>${lab}${sub}</g>`;
  },
  /* rounded label centered at (cx,cy). o: tone, size, op, bold */
  pill(id, cx, cy, str, o = {}) {
    const size = o.size || 11.5, w = tw(str, size) + 16, h = size + 10; const [f] = tone(o.tone || 'card');
    return `<g id="${id}" ${S.st(cx - w / 2, cy - h / 2, o.op)}${o.cls ? ` class="${o.cls}"` : ''}><rect x="1.5" y="2" width="${w}" height="${h}" rx="${h / 2}" fill="var(--drop)"/><rect width="${w}" height="${h}" rx="${h / 2}" style="fill:${f}" stroke="var(--ink)" stroke-width="1.3"/><text x="${w / 2}" y="${h / 2 + size * 0.36}" text-anchor="middle" font-size="${size}" font-weight="${o.weight || 700}">${esc(str)}</text></g>`;
  },
  /* callout note: title + lines. o: tone, w, op */
  note(id, x, y, title, lines, o = {}) {
    const size = o.size || 11; const w = o.w || Math.max(tw(title, 9.5) + 20, ...lines.map(l => tw(l, size) + 20));
    const h = 22 + lines.length * (size + 5) + 4; const [f] = tone(o.tone || 'paper');
    let t = `<text x="10" y="15" font-size="9.5" font-weight="800" letter-spacing=".06em" style="fill:var(--muted)">${esc(title)}</text>`;
    lines.forEach((l, i) => { t += `<text x="10" y="${33 + i * (size + 5)}" font-size="${size}" font-weight="${i === lines.length - 1 && o.boldLast ? 800 : 500}">${esc(l)}</text>`; });
    return `<g id="${id}" ${S.st(x, y, o.op)}><rect x="2" y="3" width="${w}" height="${h}" rx="8" fill="var(--drop)"/><rect width="${w}" height="${h}" rx="8" style="fill:${f}" stroke="var(--ink)" stroke-width="1.4"/>${t}</g>`;
  },
  /* straight arrow. o: color(ink|green|rust|violet|muted|blue), dash, march, w, op, both, head(false) */
  arrow(id, x1, y1, x2, y2, o = {}) {
    return S.path(id, `M${x1} ${y1}L${x2} ${y2}`, o);
  },
  path(id, d, o = {}) {
    const c = o.color || 'ink'; const col = { ink: 'var(--ink)', green: 'var(--green-ink)', rust: 'var(--rust)', violet: 'var(--violet-ink)', muted: 'var(--muted-2)', blue: 'var(--blue-ink)', orange: 'var(--orange-ink)', teal: 'var(--teal-ink)' }[c] || c;
    const mk = o.head === false ? '' : ` marker-end="url(#ar-${c in { ink: 1, green: 1, rust: 1, violet: 1, muted: 1, blue: 1, orange: 1, teal: 1 } ? c : 'ink'})"`;
    const ms = o.both ? ` marker-start="url(#ar-${c})"` : '';
    return `<path id="${id}" d="${d}" fill="none" style="stroke:${col}${o.op != null ? `;opacity:${o.op}` : ''}" stroke-width="${o.w || 1.6}" stroke-linecap="round"${o.dash ? ' stroke-dasharray="5 4"' : ''}${o.march ? ' class="march"' : ''}${mk}${ms}/>`;
  },
  /* moving dots along a path (SMIL, loops). o: color, n, dur, r, line(bool) */
  flow(id, d, o = {}) {
    const col = { green: 'var(--green-ink)', rust: 'var(--rust)', violet: 'var(--violet-ink)', orange: 'var(--orange-ink)', blue: 'var(--blue-ink)', ink: 'var(--ink)', teal: 'var(--teal-ink)' }[o.color || 'orange'] || o.color;
    const n = o.n || 2, dur = o.dur || 1.8; let dots = '';

    steps: [
      { tag: 'PROBLEM', short: 'Flat file', set: { view: 'flat', layout: 'flat', grown: false }, learn: 0, title: 'Why not just write rows into a file, one after another?',
        body: `<p>The simplest idea: <code>Alice,30\\nBob,25\\n…</code> in one long file. Press the button and make Bob’s row longer.</p><ul><li><b>Grow a row</b> → every byte after it must shift down the file.</li><li><b>Find a row</b> → read the file from the start (full scan).</li><li><b>Crash mid-write</b> → the file is half old, half new: corrupt.</li></ul>`,

        body: `<p>Real databases cut the file into equal boxes called <b>pages</b> (SQLite: 4 KB, Postgres: 8 KB). Because every page is the same size, page <i>n</i> always starts at byte <code>(n − 1) × 4096</code>.</p><p>“Find page 6” is now simple math, not a search. That is what makes trees of pages (next lesson) possible.</p>`,

/* ================= M3 · Lesson: sorted array → binary tree → B-tree ================= */
(() => {
  const CAP = 3; // toy page holds at most 3 keys
  const SEQ = [42, 17, 88, 5, 63, 29, 71, 94, 12, 50, 36, 80, 23, 58];
  const newTree = () => ({ tree: { id: 'n1', leaf: true, keys: [] }, bn: 2, ti: 0, last: null, splits: 0 });

  /* ---- toy B+tree insert (copy-up on leaf split, push-up on internal split) ---- */
  function ins(st, node, k) {
    if (node.leaf) {
      node.keys.push(k); node.keys.sort((a, b) => a - b);
      if (node.keys.length <= CAP) return null;
      const right = { id: 'n' + st.bn++, leaf: true, keys: node.keys.slice(2) };
      node.keys = node.keys.slice(0, 2); st.splits++;
      return { sep: right.keys[0], right };
    }
    let i = 0; while (i < node.keys.length && k >= node.keys[i]) i++;
    const r = ins(st, node.kids[i], k);
    if (!r) return null;
    node.keys.splice(i, 0, r.sep); node.kids.splice(i + 1, 0, r.right);
    if (node.keys.length <= CAP) return null;
    const sep = node.keys[2];
    const right = { id: 'n' + st.bn++, leaf: false, keys: node.keys.slice(3), kids: node.kids.slice(3) };
    node.keys = node.keys.slice(0, 2); node.kids = node.kids.slice(0, 3); st.splits++;
    return { sep, right };
  }
  function insert(st, k) {
    const r = ins(st, st.tree, k);
    if (r) { st.tree = { id: 'n' + st.bn++, leaf: false, keys: [r.sep], kids: [st.tree, r.right] }; }
    st.last = k;
  }
  function depth(t) { let d = 1; while (!t.leaf) { t = t.kids[0]; d++; } return d; }
  function countNodes(t) { return t.leaf ? 1 : 1 + t.kids.reduce((a, c) => a + countNodes(c), 0); }
  function pathTo(t, k) { const p = [t.id]; while (!t.leaf) { let i = 0; while (i < t.keys.length && k >= t.keys[i]) i++; t = t.kids[i]; p.push(t.id); } return p; }

  function drawTree(st, op) {
    const KW = 21; const nw = n => Math.max(1, n.keys.length) * KW + 8;
    const levels = []; (function walk(n, d) { (levels[d] = levels[d] || []).push(n); if (!n.leaf) n.kids.forEach(c => walk(c, d + 1)); })(st.tree, 0);
    const leaves = levels[levels.length - 1]; const gap = 12;
    const total = leaves.reduce((a, n) => a + nw(n), 0) + gap * (leaves.length - 1);
    const pos = {}; let x = 300 - total / 2;
    const top = 70, dy = 78, lvl = levels.length;

  const pctOf = t => Math.pow(10, -3 + 5 * t / 100); // slider 0..100 → 0.001% .. 100%
  const tOfPct = p => Math.round((Math.log10(p) + 3) / 5 * 100);
  function costs(st) {
    const m = Math.max(1, Math.round(ROWS * pctOf(st.sel) / 100));
    return { m, seq: PAGES, idx: 4 + m * 4, ios: 4 + Math.ceil(m / 300) };
  }
  const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'K' : n.toLocaleString('en-US');

  const barW = c => 20 + Math.log10(c) / Math.log10(4.2e7) * 330;

  function scene(i, st) {
    const v = st.view; const c = costs(st); const pct = pctOf(st.sel);
    const best = st.covering ? (c.ios < c.seq ? 'ios' : 'seq') : (c.idx < c.seq ? 'idx' : 'seq');
    let out = '';
    const bop = v === 'explain' ? 0 : 1;
    out += S.text('cap', 20, 34, `orders: 10M rows · ~100K pages · WHERE status = ? matches ${fmtPct(pct)} = ${fmt(c.m)} rows`, { size: 11.5, weight: 800, op: bop });
    // page grid: 10 x 4 squares, matching share coloured
    const lit = Math.min(40, Math.max(pct > 0 ? 1 : 0, Math.round(pct / 100 * 40)));
    for (let k = 0; k < 40; k++) out += `<rect id="g${k}" x="${20 + (k % 20) * 14}" y="${48 + Math.floor(k / 20) * 14}" width="11" height="11" rx="2" style="fill:${k < lit ? 'var(--orange)' : 'var(--card)'};opacity:${bop}" stroke="var(--line-strong)"/>`;
    out += S.text('g-t', 310, 66, 'share of rows that match', { size: 10.5, color: 'var(--muted)', op: bop });
    const plans = [['seq', 'Seq Scan', 'all pages, in order', c.seq], ['idx', 'Index Scan', 'random page/match', c.idx], ['ios', 'Index Only', 'covering: leaves', c.ios]];
    plans.forEach(([k, name, sub, cost], j) => {
      const y = 110 + j * 66; const dim = k === 'ios' && !st.covering;
      const win = k === best;
      out += S.text('pl-n' + j, 20, y + 4, name, { size: 12, weight: 800, color: win ? 'var(--green-ink)' : 'var(--ink)', op: bop * (dim ? .4 : 1) });
      out += S.text('pl-s' + j, 20, y + 20, sub, { size: 10.5, color: 'var(--muted)', op: bop * (dim ? .4 : 1) });
      out += S.box('pl-b' + j, 168, y - 12, barW(cost), 30, { tone: win ? 'green' : k === 'seq' ? 'blue' : k === 'idx' ? 'orange' : 'violet', flat: true, r: 5, op: bop * (dim ? .35 : 1) });
      out += S.text('pl-c' + j, 176 + barW(cost), y + 8, '~' + fmt(cost) + (win ? '  ✓ picked' : ''), { size: 11.5, weight: 700, op: bop * (dim ? .4 : 1) });

    out += S.text('foot', 20, 330, 'toy cost model: Postgres default costs — random page = 4, sequential page = 1', { size: 10.5, color: 'var(--muted)', op: bop });
    // EXPLAIN card
    const eop = v === 'explain' ? 1 : 0;
    const usesIdx = best !== 'seq';
    const lines = usesIdx
      ? ["EXPLAIN ANALYZE SELECT * FROM orders", "  WHERE status = 'pending';", '', 'Index Scan using idx_status on orders', '  (cost=0.43..812 rows=9800)        ← estimate', '  (actual time=0.03..4.1 rows=10021) ← reality', 'Execution Time: 4.9 ms']
      : ["EXPLAIN ANALYZE SELECT * FROM orders", "  WHERE status = 'completed';", '', 'Seq Scan on orders', '  (cost=0.00..225000 rows=9.9M)', "  Filter: (status = 'completed')", 'Execution Time: 1890 ms'];
    out += S.box('ex-card', 20, 40, 560, 250, { tone: 'paper', op: eop });
    lines.forEach((t, k) => { out += S.text('ex-' + k, 36, 72 + k * 26, t, { size: 12, weight: k === 3 ? 800 : 500, color: k === 3 ? 'var(--green-ink)' : null, op: eop }); });

  L('m7', {
    id: 'planner', order: 2, mins: 8, level: 'Core',
    title: 'When the database ignores your index',
    sub: 'Selectivity decides. If a query matches a big share of the table, one sequential read beats millions of random hops.',
    learn: ['Selectivity: the share of rows a filter matches', 'Seq Scan vs Index Scan vs Index Only Scan', 'Where the crossover comes from', 'Reading EXPLAIN / EXPLAIN ANALYZE', 'Why the planner can guess wrong'],
    state: { view: 'bars', sel: tOfPct(99), covering: false },
    legend: [['var(--blue)', 'Seq Scan'], ['var(--orange)', 'Index Scan'], ['var(--violet)', 'Index Only Scan'], ['var(--green)', 'cheapest']],
    metrics(i, st) {

        body: `<p><code>orders</code> has 10M rows; 99% are <code>'completed'</code>. You add an index on <code>status</code> and run <code>WHERE status = 'completed'</code>. EXPLAIN still says <b>Seq Scan</b>.</p><p>Is the planner broken? No — it did the math, and the index would be <b>slower</b>.</p>` },
      { tag: 'INSIGHT', short: 'Selectivity', set: { view: 'bars', sel: tOfPct(0.01), covering: false }, learn: [0, 1], title: 'Selectivity: how much of the table matches?',
        body: `<p>The planner compares plans by estimated cost:</p><ul><li><b>Seq Scan</b>: read all ~100K pages, in order. Sequential reads are cheap (cost 1 each).</li><li><b>Index Scan</b>: trip 1, then one <b>random</b> page read per match (cost 4 each).</li></ul><p>At 0.01% (1,000 rows) the index wins easily. At 99% it would mean ~10M random reads instead of 100K sequential ones.</p>`,
        idea: ['key', 'An index helps when the filter is <b>selective</b> (matches a small share). For a big share, reading everything in order is faster.'] },
      { tag: 'TRY IT', short: 'Crossover', set: { view: 'bars', sel: tOfPct(0.05), covering: false }, learn: 2, title: 'Find the crossover',
        body: `<p>Slide the share of matching rows. In this toy model the lines cross at ~0.25% (25,000 matches × 4 = 100,000).</p><p>Then make the index <b>covering</b>: the answer comes from the index leaves alone (no trip 2), so it stays cheap much longer.</p>`,
        idea: ['know', 'Real planners also use caching, data order (correlation) and <b>Bitmap Heap Scan</b> — collect the pointers, sort them by page, read each page once — so the real crossover moves around. The point is: there <b>is</b> a crossover.'] },
      { tag: 'TECHNIQUE', short: 'EXPLAIN', set: { view: 'explain', sel: tOfPct(0.1), covering: false }, learn: 3, title: 'Ask the planner: EXPLAIN and EXPLAIN ANALYZE',
        body: `<ul><li><code>EXPLAIN</code> shows the chosen plan and its <b>estimated</b> cost and rows. Nothing runs.</li><li><code>EXPLAIN ANALYZE</code> actually runs the query and adds <b>real</b> time and row counts.</li></ul><p>Read it bottom-up / inside-out. Plan names to recognise: <b>Seq Scan</b>, <b>Index Scan</b>, <b>Index Only Scan</b>, <b>Bitmap Heap Scan</b>.</p>`,
        idea: ['key', 'Compare <b>estimated rows</b> with <b>actual rows</b>. A big gap means the planner is working from a wrong picture of your data.'] },
      { tag: 'GOTCHA', short: 'Bad guesses', set: { view: 'explain', sel: tOfPct(60), covering: false }, learn: 4, title: 'The planner is only as good as its statistics',

      { tag: 'TAKEAWAY', short: 'Measure first', set: { view: 'bars', sel: tOfPct(0.01), covering: false }, title: 'Measure before you index (or re-architect)',
        body: `<ul><li>Selective filter → Index Scan. Big share → Seq Scan. Covering → Index Only Scan.</li><li><code>EXPLAIN ANALYZE</code> before adding indexes, and before any architecture change.</li><li>Estimated vs actual rows far apart → refresh statistics.</li></ul>`,
        idea: ['key', 'Most “the database is slow” stories end at one bad query plan. Look at the plan first.'] },

})();
} catch (e) { console.error('lesson file m4_02_planner.js failed', e); }

        body: `<p>Sorted data is what makes lookups fast (that’s the whole B-tree lesson). The question is: <b>when do you pay to keep it sorted?</b></p><p>Disks have a strong opinion. Writing to <b>random</b> spots is slow (the drive must jump around); writing <b>sequentially</b>, one byte after another, is the fastest thing a disk can do — even SSDs prefer it.</p><ul><li><b>B-tree</b> (Postgres, MySQL, SQLite): like a <b>bookshelf</b>. To add a book, walk to its exact spot and slide it in.</li><li><b>LSM-tree</b> (Cassandra, RocksDB): like an <b>inbox tray</b>. Drop new papers on the tray; now and then file the tray as one sorted folder; occasionally merge folders.</li></ul>`,

      if (s === 7) return [['Event', `${st.ev} / 5`], ['Cache', st.ev >= 4 ? '10 (stale)' : 'empty', st.ev >= 4 ? 'bad' : null], ['Postgres', st.ev >= 2 ? '12' : '10'], ['Stale lives', st.ev < 5 ? '—' : st.ttl ? '≤ 60 s' : 'forever', st.ev < 5 ? null : st.ttl ? 'warn' : 'bad']];

    controls(i, st) {
      const s = st.stage;
      const seg = (act, list, cur) => `<span class="seg">${list.map(([k, t]) => `<button data-act="${act}" data-v="${k}" class="${cur === k ? 'on' : ''}">${t}</button>`).join('')}</span>`;

      if (s === 4) return `<div class="row"><span>Write policy</span>${seg('write', [['through', 'write-through'], ['behind', 'write-behind'], ['invalidate', 'write-around / invalidate']], st.write)}<button class="tbtn ${st.crash ? 'on' : ''}" data-act="crash">💥 cache crashes</button></div>`;
      if (s === 5) return `<div class="row"><span>Case</span>${seg('cs', Object.keys(CASES).map(k => [k, CASES[k].name]), st.cs)}</div>`;
      if (s === 6) return `<div class="row"><span>Strategy</span>${seg('strat', [['ttl', 'plain TTL'], ['ahead', 'refresh-ahead, no lock'], ['single', 'refresh-ahead + single-flight']], st.strat)}</div>`;
      if (s === 7) return `<div class="row"><button class="tbtn" data-act="next">Next event →</button><button class="tbtn" data-act="reset">Reset</button><button class="tbtn ${st.ttl ? 'on' : ''}" data-act="ttl">TTL 60 s: ${st.ttl ? 'ON' : 'OFF'}</button></div>`;

    },
    steps: [
      { tag: 'PROBLEM', short: 'Why caches', set: { stage: 1 }, learn: 0, title: 'LiveJournal, 2003: the database is drowning',
        body: `<p>LiveJournal served ~50M dynamic page views a day; every page was Perl → MySQL → assemble. MySQL was drowning and new hardware was weeks away.</p><p>Brad Fitzpatrick noticed dozens of web servers sitting on mostly <b>idle RAM</b>. On May 22, 2003 he wrote <b>memcached</b>: one shared key-value pool made of that scattered RAM (Perl first, rewritten in C by Anatoly Vorobey).</p><p>Two ideas from that day still rule caching:</p><ul><li>A cache is a <b>separate process</b>, not a variable in your app.</li><li>The cache <b>doesn’t know your database exists</b>. It’s a dumb box: get / set / delete.</li></ul>` },
      { tag: 'TRY IT', short: 'Cache-aside', set: { stage: 2, hm: 'hit' }, learn: 1, title: 'Cache-aside: the app sits in the middle',
        body: `<p>The most common pattern. On every read the app asks the cache first:</p><ul><li><b>hit</b> → return it (~1 ms), Postgres untouched.</li><li><b>miss</b> → query Postgres → store the result with a TTL → return.</li></ul><p>“Aside” = the cache sits beside the DB with the app in the middle. Flip hit / miss.</p>`,
        deep: { title: 'Example: cache-aside in Python', html: `<pre>def get_product(pid):
    if cached := redis.get(f"product:{pid}"):
        return cached                             # hit
    product = db.query(...)                       # miss
    redis.set(f"product:{pid}", product, ex=300)  # fill, TTL 5 min
    return product</pre>` } },
      { tag: 'INSIGHT', short: 'Read axis', set: { stage: 3, read: 'aside' }, learn: 1, title: 'Read axis: who owns the miss?',
        body: `<p><b>Cache-aside</b> and <b>read-through</b> run the same three steps. The only difference is <b>who runs the miss logic</b>: your app, or the cache (which then must hold a DB connection / loader).</p><p>Redis and memcached can’t load anything — so “read-through with Redis” means <b>you write a wrapper</b> (<code>get_or_load()</code>). A wrapper is a <b>convention</b> (someone can still SELECT around it); DAX or a CDN is a <b>contract</b> (the DB isn’t even reachable).</p>`,
        idea: ['know', 'The real question: is your miss logic scattered over 20 call sites, or in one function?'],
        deep: { title: 'What 20 hand-written cache-aside call sites drift into', html: `<ul><li><b>TTL drift:</b> 60 s here, 24 h there, same key → random staleness.</li><li><b>Key drift:</b> <code>product:42</code> vs <code>products:42</code> → two caches; invalidation clears one.</li><li><b>Serialization drift:</b> JSON here, pickle there → reader crashes.</li><li>Someone just forgets to cache.</li><li>No single place to add a fix (single-flight, metrics, timeouts).</li></ul><p>History: read-through came from early-2000s Java caches living inside the JVM (Coherence 2001, Ehcache 2003, Guava LoadingCache). A CDN is a read-through cache: the browser never talks to the origin.</p>` } },
      { tag: 'TRY IT', short: 'Write axis', set: { stage: 4, write: 'through', crash: false }, learn: 2, title: 'Write axis: what does a write do to the copy?',
        body: `<p>After a write, should the cache hold the <b>new</b> value, <b>no</b> value, or the <b>old</b> one?</p><ul><li><b>write-through</b> — write cache + DB <b>synchronously</b> before the ack. Hidden cost: <b>cache pollution</b> — it caches every write, even rows nobody reads again.</li><li><b>write-behind</b> — write the cache, ack, flush later. Real payoff is <b>coalescing</b>: 1000 <code>INCR view_count</code> → one UPDATE a minute.</li><li><b>write-around / invalidate</b> — write the DB, delete the key; the next reader refills.</li></ul><p>Now crash the cache under write-behind.</p>`,
        idea: ['key', 'Write-behind is safe <b>if and only if</b> the ack is backed by something durable. Postgres itself is a write-behind cache (dirty pages in RAM) made safe by the WAL — if you build write-behind on Redis, what’s yours?'],
        deep: { title: '“But Redis has a WAL too?” — three catches, and where the names come from', html: `<ul><li>Redis has RDB (snapshots — lose minutes) and AOF (WAL-shaped) — but <b>AOF is off by default</b>.</li><li><code>appendfsync everysec</code> can lose ~1 s on power loss; <code>always</code> makes every write wait on fsync, killing the speed you wanted.</li><li>The killer: a pending-writes list on a Redis that is also a cache with <code>allkeys-lru</code> is <b>evictable</b> — memory fills and your queue is deleted to make room for product pages.</li></ul><p>Use write-behind for view counters, last-seen, analytics. Never for money, orders, auth, inventory — put durable pending work in Postgres (outbox) or a durable workflow (DBOS / Temporal).</p><p>History: 1965 Maurice Wilkes’ “slave memory” paper; 1968 IBM System/360 Model 85, the first commercial CPU cache — write-through. Later CPUs shipped write-back (= write-behind).</p>` } },
      { tag: 'TRY IT', short: 'Choose', set: { stage: 5, cs: 'cart' }, learn: 2, title: 'Choosing: three questions, in order',
        body: `<p><b>Read axis</b> — traffic shape decides: few call sites → cache-aside; many sites reading the same thing → read-through wrapper; hot key + expensive load → add refresh-ahead.</p><p><b>Write axis</b> — answer in order: read again soon? → a <b>plain copy</b> of the row (not derived/joined)? → OK to lose on a crash?</p><p>Question 2 is the one nobody explains: a derived value (leaderboard, rendered page, DTO joined with org name) can’t be built from the write without re-running the expensive query, so you <b>delete and let the next reader refill</b>. That’s why invalidate dominates real systems.</p>`,
        idea: ['myth', '“Invalidate is always safe.” For a shopping cart it kills the cache: add → delete → view → miss → add → delete… hit rate ≈ 0%. Read-after-write keys want write-through.'] },
      { tag: 'TRY IT', short: 'Stampede', set: { stage: 6, strat: 'ttl' }, learn: 3, title: 'The stampede: nobody should pay for the expiry',
        body: `<p>A leaderboard read 500×/s sits behind an 800 ms query. At t=60 s the key expires: ~400 requests miss within 0.8 s, each starts its own query, Postgres gets pegged, the query now takes 6 s, more pile in… a <b>cache stampede</b>.</p><p>Cache-aside and read-through both react to a miss, so neither helps. <b>Refresh-ahead</b> reloads <em>before</em> expiry (say at 30 s left) and <b>overwrites</b> the value — but without a <b>single-flight lock</b>, hundreds of requests cross the threshold together and you just moved the stampede.</p>`,
        idea: ['know', 'Size the refresh window against <b>p99 reload time</b>, not the TTL. And <b>jitter</b> TTLs (<code>300 + random(0, 60)</code>) so keys set at deploy time don’t all expire in the same second.'],
        deep: { title: 'Example: refresh-ahead + single-flight (FastAPI + Redis)', html: `<pre>TTL, REFRESH_AT, LOCK_TTL = 60, 30, 10

async def get_leaderboard():
    key = "leaderboard:global"
    cached, remaining = await (redis.pipeline()
        .get(key).ttl(key).execute())
    if cached is None:
        return await _reload(key)       # cold start: someone waits
    if remaining &lt; REFRESH_AT:
        # single-flight: only ONE request wins the lock
        if await redis.set(f"lock:{key}", "1", nx=True, ex=LOCK_TTL):
            asyncio.create_task(_reload(key))
    return json.loads(cached)           # always instant

async def _reload(key):
    data = await db.compute_leaderboard()          # 800 ms
    await redis.setex(key, TTL, json.dumps(data))  # OVERWRITE, not evict
    return data</pre><p>It never helps the very first (cold) request. HTTP twin: <code>stale-while-revalidate</code> — but that acts <em>after</em> expiry, serving stale on purpose.</p>` } },
      { tag: 'GOTCHA', short: 'The race', set: { stage: 7, ev: 0, ttl: false }, learn: 4, title: 'The invalidation race: doing it right and still losing',
        body: `<p>Standard advice: write Postgres first, <b>then</b> delete the cache key. Correct — but it only narrows the window. Step through the events.</p><p>The reader’s <code>SET</code> arrives <em>after</em> the delete, carrying a value it read <em>before</em> the update. Fixes, most used first:</p><ul><li><b>Always set a TTL</b> — doesn’t prevent the race, <b>bounds</b> it. That’s why it’s a rule.</li><li><b>Delayed double-delete</b> — delete, update, delete again ~500 ms later.</li><li><b>Version / CAS</b> — only SET if the version you read is still current (Lua script).</li><li><b>CDC-driven invalidation</b> — fires off the committed WAL; narrows a lot, never fully closes.</li></ul>` },
      { tag: 'INSIGHT', short: 'AP replica', set: { stage: 8 }, title: 'A cache is an AP replica in miniature',
        body: `<p>Look at it through the replication lens: <b>TTL</b> = allowed staleness, <b>invalidation</b> = replication, <b>stampede</b> = mass failover. CAP, in miniature.</p><p>Three more confusions to kill:</p><ul><li>“Extend the TTL on every read so hot keys never expire” → the hottest key then <b>never</b> refreshes; you fixed latency by destroying freshness. TTL does two jobs (evict cold data, bound staleness). Sliding TTL (<code>GETEX</code>) is right for <b>sessions</b>.</li><li>“Refresh-ahead = reset expiry halfway” → no: sliding TTL keeps the <b>old</b> value; refresh-ahead <b>recomputes</b> it.</li><li>“Write-through = cache on write” → the key word is <b>synchronous</b>.</li></ul><p>(Redis’s own data structures are covered in module 06.)</p>` },
      { tag: 'TAKEAWAY', short: 'Recap', set: { stage: 9 }, title: 'Caching on one card',
        body: `<ul><li>Pick <b>one from each axis</b>: read (aside / through / refresh-ahead) × write (through / behind / around-invalidate).</li><li>Write-behind only with a durable ack. Invalidate by default; write-through for read-after-write keys.</li><li>Stampede → refresh-ahead + single-flight, jittered TTLs. Race → TTL always, plus double-delete / CAS / CDC.</li></ul>`,
        idea: ['key', 'The cache doesn’t know your database exists — every pattern is just a decision about who keeps the two in sync, and when.'] },
    ],
  });

  Q('m9', { lesson: 'caching', q: 'A product page cache uses write-around/invalidate. Users editing their <b>shopping cart</b> see the hit rate for cart keys at ~0%. Why, and what fits better?', opts: ['TTL too short — raise it to 1 hour', 'Every write deletes the key and the very next action reads it → always a miss; use write-through for carts', 'Redis is evicting carts under memory pressure; add RAM'], a: 1,
    why: 'A cart is read right after every write. Invalidate deletes it each time, so the next read always misses. A plain, must-not-lose, read-after-write value is the textbook write-through case.',
    wrong: { 0: 'TTL doesn’t matter if the key is deleted on every write.', 2: 'Eviction would hit all keys, not specifically the ones you just wrote.' } });
  Q('m9', { lesson: 'caching', q: 'You add refresh-ahead (reload when &lt;30 s of TTL remain) to a key read 2,000×/s, but Postgres still spikes every minute. What’s missing?', opts: ['A longer TTL', 'A single-flight lock — every request crossing the threshold starts its own reload', 'Switching from cache-aside to read-through'], a: 1,
    why: 'Without a lock, thousands of requests hit the “refresh now” condition in the same instant and each fires the expensive query: the stampede moved earlier instead of disappearing. Only one request should win the lock and reload in the background.',
    wrong: { 0: 'A longer TTL only makes the spike less frequent; each refresh still stampedes.', 2: 'Read-through changes who runs the miss, not how many run at once.' } });

  CHEAT('m9', `<ul><li><b>Cache</b> = separate dumb box (get/set/delete) that doesn’t know the DB exists. Two axes: <b>read</b> (aside · through · refresh-ahead) × <b>write</b> (through = sync, pollution · behind = fast/coalescing, safe only with durable ack · around/invalidate = default for derived values; wrong for carts).</li><li><b>Stampede:</b> refresh-ahead + single-flight, overwrite don’t evict, jitter TTLs. <b>Race:</b> DB-then-delete still leaves stale SETs → always TTL; double-delete / CAS / CDC. Cache = AP replica in miniature.</li></ul>`);
})();
} catch (e) { console.error('lesson file m8_04_caching.js failed', e); }

        body: `<p><b>~1975.</b> A bank buys a mainframe to record transactions: <em>customer #4471 withdraws $50</em> → find one row, subtract, save. ~5 ms, thousands per second. This is <b>OLTP</b> — On-Line <b>Transaction</b> Processing (one transaction = one real-world business event).</p><p><b>~1993.</b> An executive asks: <em>total withdrawals per region per month for 3 years?</em> That query scans <b>millions</b> of rows. Run it live and every ATM freezes. This is <b>OLAP</b> — On-Line <b>Analytical</b> Processing.</p><p>Flip the toggle below to see the fix companies invented.</p>`,

        body: `<p>The database must choose the <b>order</b> it lays cells down on that line. And a disk never hands you one cell — it hands you a whole <b>block</b> (e.g. 8 KB). That one fact is why layout matters.</p><p><b>Row storage</b> (Postgres, MySQL, SQLite) writes <b>one whole record at a time</b>. “Give me customer #2, all fields” = one contiguous chunk = one fast read. Perfect for OLTP.</p>` },

        body: `<p>Watch the cells slide. <b>Columnar storage</b> (BigQuery, DuckDB, ClickHouse) writes <b>one whole column at a time</b>: all ids, then all names, then all countries…</p><p>Same data, same table in SQL. Only the order on disk changed — and that changes which questions are cheap.</p>` },
      { tag: 'GOTCHA', short: 'Row + report', set: { v: 'scan' }, learn: 2, title: 'Why row storage sabotages a report',
        body: `<p><code>SELECT AVG(salary)</code> needs one column. In the row layout, salaries sit <b>one every 5 cells</b> (one every 40 in a real table). Since reads come in whole blocks, you haul in every other column too.</p><p>Real numbers: <code>reviews</code> = 2B rows × 40 columns, ~1 KB per row. A report needs 3 small columns (<code>genre</code>, <code>stars</code>, <code>created_at</code>) ≈ 20 bytes. Row store drags ~1 KB to use ~20 B → <b>~98% waste, ≈ 2 TB read</b>.</p>`,

        body: `<ul><li><b>OLTP vs OLAP</b>: how many rows does the operation touch?</li><li><b>Narrow-and-deep</b> (one row, all columns) wants <b>rows</b>. <b>Wide-and-shallow</b> (all rows, few columns) wants <b>columns</b>.</li><li>You don’t pick a “best” layout — you match it to the workload.</li><li>The columnar warehouse is a <b>copy</b> fed from the OLTP store (nightly ETL or CDC), never the other way round.</li></ul>`,
