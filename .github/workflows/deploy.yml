# Deploy: pushing a tag <site>-vX.Y.Z (home-v1.0.0, bookmuse-v1.0.0) deploys sites/<site> to its Cloudflare Worker.
# Pushing to main never deploys. Needs the repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, Workers Routes: Edit,
# Zone: Read for wanngo.com) and CLOUDFLARE_ACCOUNT_ID.
name: deploy

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Deploy the tagged site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          site="${TAG%-v*}"
          [ -f "sites/$site/wrangler.jsonc" ] || { echo "no site '$site' for tag $TAG"; exit 1; }
          npx wrangler deploy -c "sites/$site/wrangler.jsonc"
